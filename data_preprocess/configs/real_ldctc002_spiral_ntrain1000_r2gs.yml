dataset_type: real
organ: ldctc002
model: r2gs
# GT DICOM 完整（526KB/文件，512×512，280 层，dz=1.0mm）——直接读 DICOM，物理几何同时从 DICOM 头获取
raw_gt: /opt/data/private/data/ldctc002/LDCT-and-Projection-data/C002/12-23-2021-NA-NA-62464/1.000000-Full Dose Images-22038
raw_proj: /opt/data/private/data/ldctc002/LDCT-and-Projection-data/C002/08-30-2018-NA-NA-57448/1.000000-Full dose projections-22835
gt_xy_invert: false
output_root: data
n_train: 1000
n_test: 1500
seed: 0

stitch:
  enabled: false
  n_train: 100
  n_test: 100

object_scale: 50
proj_rescale: 400

scanner:
  mode: cone
  DSD: 47.2
  DSO: 26.9260009765625
  nDetector: [64, 888]
  sDetector: [3.2764801, 45.4611614]
  nVoxel: [256, 256, 256]
  sVoxel: [16.0, 16.0, 24.0]
  offOrigin: [0, 0, 0]  # 实际值运行时从 GT 物理范围 + 投影 z_shift 范围计算
  offDetector: [0, 0]
  accuracy: 0.5
  coord_left: true
  filter: null
  noise: false
  possion_noise: 100000
  gaussian_noise: [0, 10]

spiral:
  z_start: -12
  z_end: 12
  pitch: 0.9844
  sample_per_rotation: 984
  angle_start: 0

init:
  n_points: 50000
  density_threshold: auto
  density_rescale: 0.15

real:
  auto_svoxel_from_gt: true
  equal_xyz_span: false
