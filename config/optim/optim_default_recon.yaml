steps: 30000
position_lr_init: 0.0002
position_lr_final: 0.00002
position_lr_max_steps: 1.0 #percentage of total steps
density_lr_init: 0.01
density_lr_final: 0.001
density_lr_max_steps: 1.0 #percentage of total steps
scaling_lr_init: 0.005
scaling_lr_final: 0.0005
scaling_lr_max_steps: 1.0 #percentage of total steps
rotation_lr_init: 0.001
rotation_lr_final: 0.0001
rotation_lr_max_steps: 1.0 #percentage of total steps
lambda_dssim: 0.25 # match the quality-oriented r2_gaussian_spiral baseline
use_fused_ssim: false # exact legacy loss by default; enable for maximum throughput
lambda_frequency: 0.0 # optional log-magnitude high-frequency projection loss; keep 0 for the R2 baseline
frequency_highpass_cutoff: 0.1 # radial cutoff relative to detector Nyquist frequency
lambda_tv: 0.05 # weight for the TV loss
tv_vol_size: 32 # volume sample size (cube width) for computing the TV loss

densify_gaussians: True
density_min_threshold: 0.00001
densification_interval: 100
densify_from_step: 500 # match the original spiral baseline
densify_until_step_percent: 0.5 # percentage of total steps
densify_grad_threshold: 5.0e-5
densify_scale_threshold: 0.1  # percent of volume size
max_screen_size: null
max_scale: null  # percent of volume size
max_num_gaussians: null  # optional multiplier relative to model.num_gaussians
max_num_gaussians_absolute: 500000 # original spiral quality ceiling

# --- ImprovedGS 移植（improved-densification 分支，Improved-GS 官方实现移植）---
# densification_method=legacy 时以下参数全部忽略，行为与改动前完全一致。
densification_method: legacy # legacy | improved；improved = 预算式 densify（Growth Control + 去 clone + LAS + EAS）
improved_budget_absolute: 500000 # growth control 总预算（√progress 爬坡上限；0=退回 max_num_gaussians_absolute）
improved_budget_warmup_until_offset: 500 # 预算爬坡提前多少步到顶（相对 densify 窗口末尾）
use_las: true # 长轴分裂：子代沿最长轴 ±3·d·σ 确定性放置（不再随机三维散射）
split_distance: 0.45 # LAS 子代偏移比例（3·d·σ_long；论文默认 0.45）
split_density_reduction: 0.6 # LAS 子代密度衰减系数（论文 opacity_reduction 0.6 对应移植）
eas_use: qualify # off | rank | qualify；rank=忠实论文（仅排序，资格仍梯度）；qualify=边缘分进入资格（与梯度 OR，打冷启动边缘带低梯度缺口）
eas_sample_cams: 10 # 每次 densify 事件采样的 EAS 边缘评分视角数
eas_qualify_quantile: 0.95 # qualify 模式：边缘分 ≥ 正分群体该分位的（top 5%）进入资格

ssim3d_early_stop: false
ssim3d_early_stop_threshold: 0.0
training_time_limit_seconds: 0.0
early_stop_after_steps: 0 # 0=disabled；研究用：在第 N 步 eval 后提前停（LR 衰减仍按 steps 全量走）
outside_gaussian_budget: 0.0 # 0=off；研究用(2a)：框外高斯占比上限，超出后 densify 不再选择框外高斯
